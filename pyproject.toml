[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechaverify"
version = "0.1.0"
description = "A verifiable synthetic environment for grounded mechanism and manufacturability reasoning in vision-language models."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Waseem Sajjad" }]
keywords = [
    "vision-language-models", "reinforcement-learning", "verifiable-rewards",
    "mechanism-kinematics", "design-for-manufacturing", "synthetic-data",
]
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pillow>=10.0",
]

[project.optional-dependencies]
eval = ["openai>=1.50", "google-genai>=0.3"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/itswaseemsajjad/MechaVerify"

[project.scripts]
mechaverify = "mechaverify.cli:main"

[tool.setuptools.packages.find]
include = ["mechaverify*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
